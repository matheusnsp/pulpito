<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" href="/pwa-64x64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/pwa-192x192.png" sizes="192x192" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pulpito" />
    <title>Pulpito</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pulpito-tema') || 'sistema'
          if (t === 'escuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('escuro')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
