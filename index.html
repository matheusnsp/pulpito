<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png" />
    <link rel="icon" href="/pwa-64x64-v4.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/pwa-192x192-v4.png" sizes="192x192" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pulpito" />
    <title>Pulpito</title>
    <script>
      (function () {
        var cores = { amarelo: '#0A0A0A', marinho: '#0B1220', grafite: '#0F1113', claro: '#FAFAFA' }
        try {
          var t = localStorage.getItem('pulpito-tema')
          if (!cores[t]) t = 'amarelo'
          var h = document.documentElement
          h.classList.add('tema-' + t)
          if (t !== 'claro') h.classList.add('escuro')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', cores[t])
        } catch (e) { document.documentElement.classList.add('tema-amarelo', 'escuro') }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
