# Configuração do Supabase CLI (supabase start / db push / functions deploy)
project_id = "pulpito"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/nova-senha", "http://localhost:5173/ajustes"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
secure_email_change_enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.agenda-ics]
verify_jwt = false

[functions.limpar-fotos]
verify_jwt = false
